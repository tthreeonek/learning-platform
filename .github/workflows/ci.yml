name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Checkstyle, unit + integration tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # validate: checkstyle; test: юнит-тесты; verify: интеграционные тесты (Testcontainers + PostgreSQL) и JaCoCo
      - name: mvn verify
        run: mvn -B verify

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t learning-platform:${{ github.sha }} .
      - name: Smoke test with docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/actuator/health; then break; fi
            sleep 3
          done
          curl -fs http://localhost:8080/api/courses | head -c 500
          docker compose down -v
