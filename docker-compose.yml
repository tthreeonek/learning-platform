# Запуск «из коробки»: docker compose up -d --build
# Параметры берутся из .env (скопируйте .env.example -> .env); без .env используются значения по умолчанию.
services:
  postgres:
    image: postgres:17-alpine
    container_name: learning-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-learning}
      POSTGRES_USER: ${DB_USERNAME:-learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learning}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: learning-platform:1.0.0
    container_name: learning-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-learning}
      DB_USERNAME: ${DB_USERNAME:-learning}
      DB_PASSWORD: ${DB_PASSWORD:-learning}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseSerialGC}
    ports:
      - "${APP_PORT:-8080}:8080"
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
