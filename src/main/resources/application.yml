# Общие настройки. Параметры подключения к БД задаются переменными окружения
# (DB_URL, DB_USERNAME, DB_PASSWORD), значения по умолчанию есть только в профиле dev.
spring:
  application:
    name: learning-platform
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Сессия Hibernate закрывается вместе с транзакцией сервиса.
    # Ленивые связи вне транзакции -> LazyInitializationException (так и задумано).
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        # Ленивые коллекции догружаются пачками по 25 id (смягчает N+1, ленивость сохраняется)
        default_batch_fetch_size: 25
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  seed:
    # Предзаполнение демо-данными при старте (DataSeeder)
    enabled: ${APP_SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ru.hw.learning: INFO
    # ddl-auto=update на пустой БД пишет «constraint ... does not exist, skipping» — это не ошибка
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
