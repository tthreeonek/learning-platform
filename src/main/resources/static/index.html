<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учебная платформа</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
        header { background: #2d3e50; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #cfe3ff; }
        main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
        .card { background: #fff; border: 1px solid #dde1e6; border-radius: 6px; padding: 12px 16px; }
        .course { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; }
        .course:hover, .course.active { background: #eef4ff; }
        .muted { color: #666; font-size: 13px; }
        .tag { display: inline-block; background: #e7eef9; border-radius: 3px; padding: 1px 6px; margin-right: 4px; font-size: 12px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        td, th { border-bottom: 1px solid #eee; padding: 4px 6px; text-align: left; }
        h2 { margin-top: 0; }
        h3 { margin-bottom: 6px; }
        select, input, button { font-size: 14px; padding: 4px 6px; }
        @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <b>Учебная платформа: ORM и Hibernate</b>
    <span><a href="/swagger-ui.html">Swagger UI</a></span>
</header>
<main>
    <section class="card">
        <h3>Курсы</h3>
        <input id="filter" placeholder="Поиск по названию" oninput="loadCourses()">
        <div id="courses"></div>
    </section>
    <section class="card" id="details"><p class="muted">Выберите курс слева.</p></section>
</main>
<script>
    const api = (url, opts) => fetch(url, opts).then(async r => {
        const body = r.status === 204 ? null : await r.json();
        if (!r.ok) { throw new Error(body && body.message ? body.message : r.status); }
        return body;
    });
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

    async function loadCourses() {
        const title = document.getElementById('filter').value;
        const courses = await api('/api/courses' + (title ? '?title=' + encodeURIComponent(title) : ''));
        document.getElementById('courses').innerHTML = courses.map(c =>
            `<div class="course" onclick="showCourse(${c.id}, this)"><b>${esc(c.title)}</b>
             <div class="muted">${esc(c.categoryName)} · ${esc(c.teacherName)}</div>
             <div>${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>`).join('');
    }

    async function showCourse(id, el) {
        document.querySelectorAll('.course').forEach(e => e.classList.remove('active'));
        if (el) { el.classList.add('active'); }
        const [s, stats, students, reviews, board, users] = await Promise.all([
            api(`/api/courses/${id}/structure`), api(`/api/courses/${id}/stats`), api(`/api/courses/${id}/students`),
            api(`/api/courses/${id}/reviews`), api(`/api/courses/${id}/leaderboard`), api('/api/users?role=STUDENT')]);
        const modules = s.modules.map(m => `<li><b>${esc(m.title)}</b>${m.quizId ? ' <span class="tag">тест</span>' : ''}
            <ul>${m.lessons.map(l => `<li>${esc(l.title)}</li>`).join('')}</ul></li>`).join('');
        const options = users.filter(u => !students.some(st => st.id === u.id))
            .map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
        document.getElementById('details').innerHTML = `
            <h2>${esc(s.course.title)}</h2>
            <p>${esc(s.course.description)}</p>
            <p class="muted">Студентов: ${stats.students}, завершили: ${stats.completed}, заданий: ${stats.assignments},
               решений: ${stats.submissions}, попыток тестов: ${stats.quizAttempts}, рейтинг: ${stats.averageRating ?? '—'}</p>
            <h3>Структура</h3><ol>${modules}</ol>
            <h3>Рейтинг студентов</h3>
            <table><tr><th>#</th><th>Студент</th><th>Итог, %</th></tr>
            ${board.map(b => `<tr><td>${b.place}</td><td>${esc(b.studentName)}</td><td>${b.overallPercent ?? '—'}</td></tr>`).join('')}</table>
            <p><select id="student">${options}</select> <button onclick="enroll(${id})">Записать на курс</button>
               <span id="msg" class="muted"></span></p>
            <h3>Отзывы</h3>
            ${reviews.map(r => `<p><b>${esc(r.studentName)}</b> — ${'★'.repeat(r.rating)}<br>${esc(r.comment)}</p>`).join('') || '<p class="muted">Нет отзывов</p>'}`;
    }

    async function enroll(courseId) {
        const userId = document.getElementById('student').value;
        try {
            await api(`/api/courses/${courseId}/enroll?userId=${userId}`, {method: 'POST'});
            showCourse(courseId, document.querySelector('.course.active'));
        } catch (e) {
            document.getElementById('msg').textContent = e.message;
        }
    }

    loadCourses();
</script>
</body>
</html>
